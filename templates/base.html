<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SF Giants 2026{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --giants-orange: #FD5A1E;
      --giants-black: #000000;
      --giants-cream:  #EFD19F;
    }
    body { background-color: #0d0d0d; }

    .navbar { background-color: var(--giants-black) !important; border-bottom: 3px solid var(--giants-orange); }
    .navbar-brand { color: var(--giants-orange) !important; font-weight: 800; font-size: 1.3rem; letter-spacing: 1px; }
    .nav-link { color: #ccc !important; }
    .nav-link:hover, .nav-link.active { color: var(--giants-orange) !important; }

    .page-header {
      background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
      border-left: 5px solid var(--giants-orange);
      padding: 1.2rem 1.5rem;
      margin-bottom: 1.5rem;
      border-radius: 4px;
    }
    .page-header h1 { color: var(--giants-orange); font-weight: 800; margin: 0; font-size: 1.6rem; letter-spacing: 1px; }
    .page-header p  { color: #aaa; margin: 0.25rem 0 0; font-size: 0.9rem; }

    .stat-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 1.2rem;
      text-align: center;
    }
    .stat-card .label { color: #888; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1px; }
    .stat-card .value { color: #fff; font-size: 2rem; font-weight: 800; line-height: 1.1; }
    .stat-card .value.orange { color: var(--giants-orange); }
    .stat-card .sub   { color: #aaa; font-size: 0.82rem; }

    table.giants-table { font-size: 0.88rem; }
    table.giants-table thead th {
      background-color: #111;
      color: var(--giants-orange);
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      border-color: #333;
      white-space: nowrap;
    }
    table.giants-table tbody tr { border-color: #2a2a2a; }
    table.giants-table tbody tr:hover { background-color: #1f1f1f; }
    table.giants-table tbody td { border-color: #2a2a2a; color: #ddd; vertical-align: middle; }
    table.giants-table tbody td.player-name { color: #fff; font-weight: 600; }

    .badge-w  { background-color: #198754; color: #fff; font-weight: 700; padding: 3px 9px; border-radius: 4px; }
    .badge-l  { background-color: #dc3545; color: #fff; font-weight: 700; padding: 3px 9px; border-radius: 4px; }
    .badge-live { background-color: #ffc107; color: #000; font-weight: 700; padding: 3px 9px; border-radius: 4px; }

    .linescore-table th, .linescore-table td {
      text-align: center; padding: 6px 10px; border-color: #333; font-size: 0.9rem;
    }
    .linescore-table .team-col { text-align: left; font-weight: 700; color: var(--giants-orange); min-width: 160px; }
    .linescore-table .total-col { font-weight: 700; border-left: 2px solid #444; }

    .section-header {
      color: var(--giants-orange);
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 0.4rem 0;
      border-bottom: 1px solid #333;
      margin-bottom: 0.75rem;
    }

    .game-note { border-left: 3px solid var(--giants-orange); padding: 6px 12px; margin-bottom: 6px; background: #1a1a1a; border-radius: 0 4px 4px 0; color: #ccc; font-size: 0.88rem; }

    footer { border-top: 1px solid #222; color: #555; font-size: 0.8rem; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">⚾ SF GIANTS 2026</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link {% if request.endpoint=='schedule' %}active{% endif %}" href="/">Schedule</a></li>
        <li class="nav-item"><a class="nav-link {% if request.endpoint=='hitting' %}active{% endif %}"  href="/hitting">Hitting</a></li>
        <li class="nav-item"><a class="nav-link {% if request.endpoint=='pitching' %}active{% endif %}" href="/pitching">Pitching</a></li>
        <li class="nav-item"><a class="nav-link {% if request.endpoint=='summary' %}active{% endif %}"  href="/summary">Summary</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container pb-5">
  {% block content %}{% endblock %}
</div>

<footer class="mt-5 py-3 text-center">
  <div class="container">SF Giants 2026 Stat Tracker &mdash; data via MLB Stats API &mdash; run <code>python giants_tracker.py update</code> to refresh</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
